<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var th = localStorage.getItem('webdesigner:theme');
        if (!th) th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = th;
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 11l-4 5 4 5M23 11l4 5-4 5M18 8l-4 16' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span class="brand-name" data-i18n="appName"></span>
      </div>

      <div class="group file-group">
        <button class="tb" id="btn-new" data-i18n-title="new"><i data-icon="FilePlus"></i><span data-i18n="new"></span></button>
        <button class="tb" id="btn-projects" data-i18n-title="myProjects"><i data-icon="Blocks"></i><span data-i18n="myProjects"></span></button>
        <button class="tb" id="btn-open" data-i18n-title="open"><i data-icon="FolderOpen"></i><span data-i18n="open"></span></button>
        <button class="tb" id="btn-save" data-i18n-title="save"><i data-icon="Save"></i><span data-i18n="save"></span></button>
        <button class="tb" id="btn-folder" data-i18n-title="saveFolder"><i data-icon="FolderDown"></i></button>
        <button class="tb" id="btn-zip" data-i18n-title="download"><i data-icon="Download"></i></button>
      </div>

      <input id="project-name" class="project-name" dir="auto" data-i18n-title="projectName" />

      <div class="spacer"></div>

      <div class="seg" id="mode-switch" role="tablist">
        <button data-mode="visual" role="tab"><i data-icon="Paintbrush"></i><span data-i18n="visual"></span></button>
        <button data-mode="split" role="tab"><i data-icon="PanelsTopLeft"></i><span data-i18n="split"></span></button>
        <button data-mode="code" role="tab"><i data-icon="Code"></i><span data-i18n="code"></span></button>
      </div>

      <div class="seg icons" id="device-switch">
        <button data-device="desktop" data-i18n-title="desktop"><i data-icon="Monitor"></i></button>
        <button data-device="tablet" data-i18n-title="tablet"><i data-icon="Tablet"></i></button>
        <button data-device="phone" data-i18n-title="phone"><i data-icon="Smartphone"></i></button>
      </div>

      <div class="group">
        <button class="tb icon" id="btn-undo" data-i18n-title="undo"><i data-icon="Undo2"></i></button>
        <button class="tb icon" id="btn-redo" data-i18n-title="redo"><i data-icon="Redo2"></i></button>
      </div>

      <div class="group teach-group">
        <button class="tb toggle" id="btn-xray" data-i18n-title="xrayTitle" aria-pressed="false"><i data-icon="ScanEye"></i><span data-i18n="xray"></span></button>
        <button class="tb toggle icon" id="btn-flash" data-i18n-title="showChanges" aria-pressed="true"><i data-icon="Sparkles"></i></button>
        <button class="tb" id="btn-kits" data-i18n-title="designKits"><i data-icon="SwatchBook"></i><span data-i18n="designKits"></span></button>
      </div>

      <div class="spacer"></div>

      <div class="group">
        <button class="tb icon" id="btn-theme" data-i18n-title="darkMode"><i data-icon="Moon"></i></button>
        <button class="tb icon" id="btn-check" data-i18n-title="check"><i data-icon="SquareCheck"></i></button>
        <button class="tb icon" id="btn-more" data-i18n-title="moreTools" aria-haspopup="menu" aria-expanded="false"><i data-icon="Ellipsis"></i></button>
        <div class="more-menu" id="more-menu" role="menu" hidden>
          <button role="menuitem" id="btn-page"><i data-icon="Settings"></i><span data-i18n="pageSettings"></span></button>
          <button role="menuitem" id="btn-paste"><i data-icon="ClipboardPaste"></i><span data-i18n="pasteHtml"></span></button>
          <button role="menuitem" id="btn-big"><i data-icon="ZoomIn"></i><span data-i18n="bigUi"></span></button>
          <button role="menuitem" id="btn-lang"><i data-icon="Languages"></i><span data-i18n="langSwitch"></span></button>
        </div>
        <button class="tb primary" id="btn-preview" data-i18n-title="preview"><i data-icon="Eye"></i><span data-i18n="preview"></span></button>
      </div>
    </header>

    <main class="workspace" id="workspace" data-mode="visual">
      <aside class="panel left">
        <div class="tabs" role="tablist">
          <button class="active" data-tab="blocks"><i data-icon="Blocks"></i><span data-i18n="blocks"></span></button>
          <button data-tab="media"><i data-icon="Images"></i><span data-i18n="images"></span></button>
          <button data-tab="layers"><i data-icon="Layers"></i><span data-i18n="structure"></span></button>
        </div>
        <div class="tab-body" data-tab-body="blocks">
          <p class="hint" data-i18n="dragHint"></p>
          <div id="blocks"></div>
        </div>
        <div class="tab-body media-body" id="media" data-tab-body="media" hidden></div>
        <div class="tab-body" id="layers" data-tab-body="layers" hidden></div>
      </aside>

      <section class="center">
        <div class="stage"><div id="gjs"></div></div>
        <div class="splitter" id="splitter" title="Drag"></div>
        <div class="code-pane">
          <div class="code-head">
            <span class="file-label"><i data-icon="Globe"></i>index.html</span>
            <span class="code-hint" data-i18n="codeHint"></span>
            <span class="code-hint emmet" data-i18n="emmetHint"></span>
            <span class="file-label"><i data-icon="Palette"></i>style.css</span>
          </div>
          <div class="code-grid">
            <div class="code-col"><div class="code-title">HTML · index.html</div><div id="code-html" class="cm-host" dir="ltr"></div></div>
            <div class="code-col">
              <div class="code-tabs" role="tablist">
                <button class="active" data-code-tab="css">CSS · style.css</button>
                <button data-code-tab="js">JS · script.js</button>
                <button data-code-tab="console"><span data-i18n="console"></span><b id="console-badge" hidden></b></button>
              </div>
              <div id="code-css" class="cm-host" dir="ltr" data-code-body="css"></div>
              <div class="js-pane" data-code-body="js" hidden>
                <div class="js-bar">
                  <button class="js-run" id="btn-run"><i data-icon="Eye"></i><span data-i18n="run"></span></button>
                  <select id="js-snippets"></select>
                  <span class="js-note" data-i18n="jsNote"></span>
                </div>
                <div id="code-js" class="cm-host" dir="ltr"></div>
              </div>
              <div class="console-pane" data-code-body="console" hidden>
                <div class="js-bar"><button class="js-run ghost" id="btn-console-clear" data-i18n="clear"></button></div>
                <div id="console-out" class="console-out" dir="ltr"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="panel right">
        <div class="panel-title" data-i18n="properties"></div>
        <div class="scroll">
          <div class="card-box">
            <div class="box-title" data-i18n="format"></div>
            <div id="format"></div>
          </div>
          <div id="element-info" class="element-info" hidden></div>
          <p id="nothing-selected" class="hint center-hint" data-i18n="nothingSelected"></p>
          <div id="context-tools"></div>
          <div id="bg-tools" class="card-box"></div>
          <div id="fx-tools" class="card-box" hidden></div>
          <details class="card-box" open>
            <summary class="box-title" data-i18n="settings"></summary>
            <div id="traits"></div>
          </details>
          <details class="card-box" open>
            <summary class="box-title" data-i18n="style"></summary>
            <div class="selectors-wrap">
              <div class="mini-title" data-i18n="classes"></div>
              <p class="hint tight" data-i18n="classesHint"></p>
              <div id="selectors"></div>
            </div>
            <div id="styles"></div>
          </details>
        </div>
      </aside>
    </main>

    <footer class="statusbar">
      <span id="status-save"></span>
      <span id="status-path" class="crumbs" dir="ltr"></span>
    </footer>

    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
